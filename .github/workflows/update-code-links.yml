name: Weekly code-link refresh

on:
  schedule:
    # Mondays at 05:23 UTC: re-check recent papers that had no code link yet.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-data
  cancel-in-progress: false

env:
  COMMIT_USER_NAME: github-actions[bot]
  COMMIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  links:
    name: Refresh code links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh code links
        run: python daily_arxiv.py --update-links

      - name: Commit and push changes
        run: |
          bash .github/scripts/commit-and-push.sh "data: weekly code-link refresh"
