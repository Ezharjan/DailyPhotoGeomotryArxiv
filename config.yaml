    title_keywords: ["DUSt3R", "MASt3R", "VGGT", "VGGSfM", "pointmap", "pointmaps", "feed-forward 3D",
                     "feed-forward reconstruction", "feed-forward Gaussian", "pose-free", "unposed",
                     "geometry foundation model", "geometric foundation model", "CUT3R", "Fast3R", "MonST3R",
                     "Spann3R"]
    keywords: ["DUSt3R", "MASt3R", "VGGT", "VGGSfM", "pointmap", "pointmaps", "feed-forward 3D reconstruction",
               "pose-free 3D reconstruction", "unposed images"]
