  - slug: slam-odometry
    name: "SLAM & Visual Odometry"
    description: "Visual and visual-inertial odometry, monocular, stereo and RGB-D SLAM, loop closure and pose-graph optimization."
    title_keywords: ["SLAM", "visual odometry", "visual-inertial", "loop closure", "simultaneous localization and mapping",
                     "pose graph", "LiDAR-visual", "visual-LiDAR"]
