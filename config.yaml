# =============================================================================
# Photo Geometry arXiv Daily — configuration
# =============================================================================
# Tracks new arXiv papers on photo geometry (geometric computer vision):
# camera models and calibration (intrinsics/extrinsics), generalized cameras,
# multi-view geometry, pose estimation, 3D reconstruction and related topics.
#
# How a topic is matched on arXiv
# -------------------------------
# * title_keywords  -> phrase must appear in the paper TITLE.
# * keywords        -> phrase may appear in the TITLE or the ABSTRACT.
#                      Use only specific technical phrases here; generic phrases
#                      that are often mentioned in passing belong in title_keywords.
# * exclude_title_keywords (optional) -> papers whose TITLE contains any of these
#                      phrases are dropped (used to filter out medical imaging, etc.).
# * Every topic query is restricted to the arXiv categories listed under
#   `arxiv.categories` (a paper matches if ANY of its categories is listed).
#
# arXiv's search engine is case-insensitive, treats hyphens as spaces and
# stems words ("calibrated" == "calibration", "projective" == "projection",
# "generalized" == "generation"). The phrases below were chosen and tested
# against the live arXiv API with this behaviour in mind.
#
# Keep each topic's `slug` stable: papers are linked to topics by slug, so
# renaming a slug starts that topic's history from scratch.
# =============================================================================

arxiv:
  # arXiv categories searched (cross-listed papers are included).
  categories: ["cs.CV", "cs.RO", "cs.GR", "eess.IV"]
  # Newest papers requested per topic and run (sorted by submission date).
  # Topics receive far fewer than 100 new papers per day, so nothing is missed.
  max_results_per_topic: 100
  # arXiv API terms of use ask for at most one request every 3 seconds.
  request_delay_seconds: 3.5
  num_retries: 5

code_links:
  # Code and project links are taken from the arXiv abstract/comments first.
  # Papers without a link in their metadata are then looked up on the
  # Hugging Face Papers API (the original Papers with Code API was shut down in July 2025).
  huggingface_lookup: true
  # Upper bound on Hugging Face API requests per run (keeps runs fast and polite).
  max_lookups_per_run: 300
  # `--update-links` re-checks papers without code that were submitted within
  # this many days (authors often release code a few weeks after submission).
  recheck_days: 60

output:
  # Single source of truth for all tracked papers (also used by the Explorer page).
  data_file: "docs/photo-geometry-arxiv-daily.json"
  # Jekyll site root (GitHub Pages: "Deploy from a branch" -> /docs).
  site_dir: "docs"
  # Number of most recent papers listed on the home page.
  home_latest_papers: 60
  # Maximum number of papers rendered on each topic page (the rest stay
  # searchable in the Paper Explorer).
  topic_page_max_papers: 300

topics:
  # ---------------------------------------------------------------------------
  # Camera models and calibration
  # ---------------------------------------------------------------------------
  - slug: camera-calibration
    name: "Camera Calibration & Intrinsics"
    description: "Intrinsic calibration, lens and radial distortion models, self- and auto-calibration, focal-length estimation and radiometric (photometric) camera calibration."
    title_keywords: ["camera calibration", "calibrating cameras", "intrinsic calibration", "camera intrinsics",
                     "intrinsic parameters", "camera parameters", "lens distortion", "radial distortion",
                     "distortion model", "camera self-calibration", "camera auto-calibration", "autocalibration",
                     "focal length", "calibration target", "calibration pattern", "radiometric calibration",
                     "photometric calibration", "camera response function", "vignetting"]
    keywords: ["radial distortion", "lens distortion", "intrinsic calibration", "camera self-calibration",
               "focal length estimation", "camera response function"]

  - slug: extrinsic-calibration
    name: "Extrinsic & Multi-Sensor Calibration"
    description: "Camera extrinsics and the rigid transforms between cameras, LiDAR, radar and IMUs: target-based and targetless, hand-eye, spatiotemporal and multi-camera calibration."
    title_keywords: ["extrinsic calibration", "extrinsic parameters", "camera extrinsics", "LiDAR-camera calibration",
                     "camera-LiDAR calibration", "LiDAR calibration", "camera-IMU calibration",
                     "visual-inertial calibration", "hand-eye calibration", "targetless calibration",
                     "target-free calibration", "target-less calibration", "multi-camera calibration",
                     "stereo calibration", "spatiotemporal calibration", "radar-camera calibration",
                     "multi-sensor calibration"]
    keywords: ["extrinsic calibration", "hand-eye calibration", "LiDAR-camera calibration", "camera-LiDAR calibration",
               "camera-IMU calibration", "targetless calibration", "target-free calibration"]

  - slug: generalized-cameras
    name: "Generalized & Non-Central Camera Models"
    description: "Cameras modeled as sets of rays: generalized and non-central cameras, multi-camera rigs treated as one generalized camera, Plücker-line formulations, rolling-shutter, light-field/plenoptic and pushbroom models."
    title_keywords: ["generalized camera", "non-central camera", "noncentral camera", "generic camera model",
                     "camera model", "camera models", "multi-camera rig", "camera rig", "rolling shutter",
                     "light field camera", "plenoptic camera", "pushbroom", "Plücker", "Plucker", "axial camera"]
    keywords: ["generalized epipolar", "generalized essential matrix", "non-central camera", "noncentral camera",
               "multi-camera rig", "pushbroom camera", "axial camera"]

  - slug: omnidirectional-cameras
    name: "Omnidirectional, Fisheye & Panoramic Imaging"
    description: "Catadioptric, fisheye, 360-degree and spherical cameras, equirectangular and unified camera models, wide-angle imaging, panorama and image stitching."
    title_keywords: ["omnidirectional camera", "omnidirectional image", "omnidirectional vision", "omnidirectional video",
                     "omnidirectional depth", "omnidirectional stereo", "fisheye", "fish-eye", "catadioptric",
                     "360-degree", "equirectangular", "panoramic camera", "panoramic image", "panoramic depth",
                     "panoramic video", "panorama stitching", "image stitching", "spherical image",
                     "spherical camera", "wide-angle", "ultra-wide"]
    keywords: ["catadioptric", "omnidirectional camera", "fisheye camera", "fisheye lens", "fisheye image",
               "equirectangular projection", "unified camera model", "spherical camera model"]

  # ---------------------------------------------------------------------------
  # Single-view, two-view and multi-view geometry
  # ---------------------------------------------------------------------------
  - slug: projective-geometry
    name: "Single-View & Projective Geometry"
    description: "Vanishing points, horizon lines, Manhattan/Atlanta-world structure, single-view metrology, image rectification, line-segment and wireframe geometry."
    title_keywords: ["vanishing point", "horizon line", "Manhattan world", "Atlanta world", "single view metrology",
                     "single-view metrology", "projective geometry", "projective reconstruction",
                     "metric rectification", "affine rectification", "perspective field", "line segment detection",
                     "wireframe", "cross-ratio", "perspective distortion"]
    keywords: ["vanishing point", "Manhattan world", "Atlanta world", "single view metrology", "metric rectification",
               "absolute conic"]
    exclude_title_keywords: ["tomography", "CT", "X-ray"]

  - slug: epipolar-geometry
    name: "Epipolar Geometry & Relative Pose"
    description: "Two- and multi-view relations: epipolar constraints, essential and fundamental matrices, homographies, trifocal tensors and relative camera pose."
    title_keywords: ["epipolar", "essential matrix", "fundamental matrix", "relative pose estimation",
                     "relative camera pose", "relative pose solver", "homography", "trifocal", "two-view geometry",
                     "multiple view geometry", "multi-view geometry", "five-point", "eight-point"]
    keywords: ["epipolar geometry", "epipolar constraint", "essential matrix", "fundamental matrix", "trifocal tensor",
               "two-view relative pose", "homography estimation", "five-point algorithm", "eight-point algorithm"]

  - slug: minimal-solvers
    name: "Minimal Solvers & Robust Estimation"
    description: "Minimal solvers and polynomial (Gröbner-basis, homotopy) methods, RANSAC and its variants, consensus maximization, M-estimators and outlier-robust geometric fitting."
    title_keywords: ["minimal solver", "minimal solvers", "RANSAC", "robust model fitting", "robust fitting",
                     "robust estimation", "outlier rejection", "consensus maximization", "Gröbner", "Grobner",
                     "polynomial solver", "homotopy continuation", "graduated non-convexity", "M-estimator",
                     "MAGSAC", "truncated least squares"]
    keywords: ["minimal solver", "Gröbner basis", "Grobner basis", "consensus maximization", "graduated non-convexity",
               "robust model fitting"]

  - slug: visual-localization
    name: "Absolute Pose & Visual Localization"
    description: "Perspective-n-Point and absolute pose, camera localization and relocalization against maps, scene coordinate regression and absolute pose regression."
    title_keywords: ["absolute pose", "perspective-n-point", "camera pose estimation", "camera localization",
                     "camera relocalization", "visual localization", "visual relocalization",
                     "scene coordinate regression", "absolute pose regression", "camera pose",
                     "map-free relocalization"]
    keywords: ["perspective-n-point", "absolute pose estimation", "camera relocalization", "visual relocalization",
               "scene coordinate regression", "absolute pose regression"]

  - slug: feature-matching
    name: "Feature Matching & Correspondence"
    description: "Keypoint detection and description, sparse, semi-dense and dense feature matching, and geometric correspondence estimation."
    title_keywords: ["feature matching", "image matching", "local feature matching", "local feature detection",
                     "keypoint matching", "keypoint detection and description", "feature detection and description",
                     "local descriptor", "feature descriptor", "dense correspondence", "correspondence estimation",
                     "dense matching", "semi-dense matching", "detector-free", "LightGlue", "LoFTR", "SuperGlue",
                     "SuperPoint", "matcher"]
    keywords: ["local feature matching", "keypoint matching", "LightGlue", "LoFTR", "SuperGlue", "SuperPoint",
               "detector-free matching"]
    exclude_title_keywords: ["semantic correspondence"]

  # ---------------------------------------------------------------------------
  # 3D reconstruction, SLAM and motion
  # ---------------------------------------------------------------------------
  - slug: structure-from-motion
    name: "Structure from Motion & Bundle Adjustment"
    description: "Incremental and global structure from motion, bundle adjustment, rotation, translation and motion averaging, and camera resectioning."
    title_keywords: ["structure from motion", "SfM", "bundle adjustment", "rotation averaging", "translation averaging",
                     "motion averaging", "camera resectioning"]
    keywords: ["rotation averaging", "translation averaging", "motion averaging", "global structure from motion",
               "incremental structure from motion"]

  - slug: feed-forward-reconstruction
