<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="360" height="210" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Two-view geometry: camera centres C1, C2 observe a 3D point X; its images x1, x2 lie on the image planes. -->
  <g fill="none" stroke="#1f5fd6" stroke-linecap="round" stroke-linejoin="round">
    <!-- epipolar plane -->
    <path d="M70 168 L180 34 L290 168 Z" fill="#1f5fd6" fill-opacity="0.06" stroke="none"/>
    <!-- baseline -->
    <path d="M70 168 L290 168" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="3 6"/>
    <!-- camera frustums -->
    <path d="M70 168 L42 110 M70 168 L104 98 M70 168 L58 142 M70 168 L118 128" stroke-opacity="0.22" stroke-width="1.2"/>
    <path d="M290 168 L318 110 M290 168 L256 98 M290 168 L302 142 M290 168 L242 128" stroke-opacity="0.22" stroke-width="1.2"/>
    <!-- image planes -->
    <path d="M42 110 L104 98 L118 128 L58 142 Z" fill="#ffffff" fill-opacity="0.85" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M318 110 L256 98 L242 128 L302 142 Z" fill="#ffffff" fill-opacity="0.85" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- rays through the image points -->
    <path d="M70 168 L180 34 M290 168 L180 34" stroke-opacity="0.75" stroke-width="2"/>
    <!-- epipolar lines on the image planes -->
    <path d="M53.8 133.5 L114.6 120.7" stroke="#e08a00" stroke-opacity="0.7" stroke-width="1.6"/>
    <path d="M306.2 133.5 L245.4 120.7" stroke="#e08a00" stroke-opacity="0.7" stroke-width="1.6"/>
  </g>
  <g>
    <circle cx="70" cy="168" r="6" fill="#1f5fd6"/>
    <circle cx="290" cy="168" r="6" fill="#1f5fd6"/>
    <circle cx="180" cy="34" r="7" fill="#ffc53d" stroke="#e08a00" stroke-width="1.5"/>
    <circle cx="107.6" cy="122.2" r="3.4" fill="#1f5fd6"/>
    <circle cx="252.4" cy="122.2" r="3.4" fill="#1f5fd6"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#1f5fd6" fill-opacity="0.85">
    <text x="62" y="194">C</text><text x="73" y="198" font-size="10">1</text>
    <text x="283" y="194">C</text><text x="294" y="198" font-size="10">2</text>
    <text x="193" y="30">X</text>
    <text x="99" y="146" font-size="13">x</text><text x="107" y="150" font-size="9">1</text>
    <text x="246" y="146" font-size="13">x</text><text x="254" y="150" font-size="9">2</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
